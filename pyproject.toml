[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-audio"
version = "0.1.0"
description = "Offline adaptive audio baseline for film and TV"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
ai = ["onnxruntime>=1.20"]

[project.scripts]
adaptive-audio = "adaptive_audio.cli:main"
adaptive-audio-report = "adaptive_audio.report:main"
adaptive-audio-classify = "adaptive_audio.classify_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
