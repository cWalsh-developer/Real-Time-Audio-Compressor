[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-audio"
version = "0.1.0"
description = "Adaptive audio processing and rolling look-ahead prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
ai = ["onnxruntime>=1.20"]
training = ["torch>=2.5", "onnx>=1.16"]

[project.scripts]
adaptive-audio = "adaptive_audio.cli:main"
adaptive-audio-report = "adaptive_audio.report:main"
adaptive-audio-classify = "adaptive_audio.classify_cli:main"
adaptive-audio-rolling = "adaptive_audio.rolling_cli:main"
adaptive-audio-train = "adaptive_audio.train_cli:main"
adaptive-audio-eval-train = "adaptive_audio.eval_train_cli:main"
adaptive-audio-benchmark-train = "adaptive_audio.benchmark_train_cli:main"
adaptive-audio-export-model = "adaptive_audio.export_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
